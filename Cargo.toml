[workspace]
members = ["prover"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ZK-ORIGIN Team"]
license = "MIT"

[workspace.dependencies]
# Crypto primitives
bellman = "0.14"
ff = "0.13"
ff_ce = "0.11"
group = "0.13"
pairing = "0.23"
ark-std = "0.4"
ark-ff = "0.4"
ark-ec = "0.4"
ark-serialize = "0.4"
ark-relations = "0.4"
ark-r1cs-std = "0.4"
ark-groth16 = "0.4"
ark-bn254 = "0.4"
ark-crypto-primitives = "0.4"

# Poseidon hash
poseidon-rs = "0.0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
hex = "0.4"

# Utilities
rand = "0.8"
sha2 = "0.10"
thiserror = "1.0"
anyhow = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Performance
rayon = "1.8"
criterion = "0.5"

[package]
name = "zk-origin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Workspace dependencies
bellman.workspace = true
ff.workspace = true
ff_ce.workspace = true
group.workspace = true
pairing.workspace = true
poseidon-rs.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
rand.workspace = true
sha2.workspace = true
thiserror.workspace = true
anyhow.workspace = true
clap.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bin]]
name = "generate_policy"
path = "src/bin/generate_policy.rs"

[[bin]]
name = "zk-origin"
path = "src/bin/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0

[profile.bench]
inherits = "release"