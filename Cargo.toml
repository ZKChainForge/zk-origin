[workspace]
members = [
    "core",
    "prover",
    "orchestrator",
    "sdk",
    "nova",
]

resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["ZK-ORIGIN Team"]
license = "MIT"
repository = "https://github.com/ZKChainForge/zk-origin"

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Cryptography
sha3 = "0.10"
sha2 = "0.10"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
blake3 = "1.5"

# HTTP/RPC
reqwest = { version = "0.11", features = ["json"] }
ethers = { version = "2.0", features = ["rustls"] }
web3 = "0.19"

# CLI & utilities
clap = { version = "4.4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
dotenv = "0.15"
anyhow = "1.0"
thiserror = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Misc
uuid = { version = "1.6", features = ["v4", "serde"] }
lazy_static = "1.4"
criterion = "0.5"
tempfile = "3.8"

# Arkworks (Nova uses this)
ark-ff = "0.4"
ark-ec = "0.4"
ark-bn254 = "0.4"
ark-serialize = "0.4"
ff = "0.13"

# ============ PROFILES (Root only) ============

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 1

[profile.bench]
opt-level = 3
lto = true