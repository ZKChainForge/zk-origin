# orchestrator/Cargo.toml

[package]
name = "zk-origin-orchestrator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Orchestrator for ZK-ORIGIN end-to-end pipeline"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
ethers = { workspace = true }
web3 = { workspace = true }
clap = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
dotenv = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

# Interop with other crates
zk-origin-core = { path = "../core" }
zk-origin-prover = { path = "../prover" }

[[bin]]
name = "orchestrator"
path = "src/main.rs"

[[bin]]
name = "orchestrator-cli"
path = "src/bin/cli.rs"

[lib]
name = "zk_origin_orchestrator"
path = "src/lib.rs"