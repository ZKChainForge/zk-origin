

version: '3.8'

services:
  prover:
    build:
      context: ./prover
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - METRICS_PORT=9090
    volumes:
      - ./circuits/build:/app/circuits:ro
      - prover-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: ./demo
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - RPC_URL=${RPC_URL}
      - CONTRACT_ADDRESS=${CONTRACT_ADDRESS}
      - PROVER_URL=http://prover:8080
    depends_on:
      - prover
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=zkorigin
      - POSTGRES_USER=zkorigin
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  indexer:
    build:
      context: ./demo
      dockerfile: Dockerfile.indexer
    environment:
      - RPC_URL=${RPC_URL}
      - CONTRACT_ADDRESS=${CONTRACT_ADDRESS}
      - DATABASE_URL=postgres://zkorigin:${DB_PASSWORD}@db:5432/zkorigin
    depends_on:
      - db

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  prover-data:
  postgres-data:
  prometheus-data:
  grafana-data: