[package]
name = "zk-origin-core"
version = "2.0.0"
edition = "2021"
authors = ["ZK-ORIGIN Team"]
description = "Production-grade state machine for ZK-ORIGIN with cryptographic lineage tracking"
license = "MIT"
repository = "https://github.com/ZKChainForge/zk-origin"

[dependencies]
# Core cryptography
sha3 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Async runtime
tokio = { version = "1.35", features = ["full"], optional = true }

# Database
rocksdb = { version = "0.21", optional = true }

# Testing
[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

[features]
default = ["async", "persistence"]
async = ["tokio"]
persistence = ["rocksdb"]
production = ["async", "persistence"]

[[bin]]
name = "zk-origin-core"
path = "src/bin/cli.rs"