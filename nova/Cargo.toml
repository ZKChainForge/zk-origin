[package]
name = "zk-origin-nova"
version = "2.0.0"
edition = "2021"
authors = ["ZK Origin Team"]
description = "Constant-size proofs for arbitrary lineage depth through recursive composition"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
sha3 = "0.10"
blake3 = "1.5"
hex = "0.4"
thiserror = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "nova_benchmarks"
harness = false

[profile.test]
opt-level = 2

[profile.bench]
opt-level = 3
lto = true