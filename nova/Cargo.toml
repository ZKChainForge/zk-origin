[package]
name = "zk-origin-nova"
version = "1.0.0"
edition = "2021"

[dependencies]
# Nova folding scheme
nova = { git = "https://github.com/microsoft/Nova", branch = "main" }
bellpepper = "0.1"
bellpepper-core = "0.1"

# Field arithmetic
ff = "0.13"
ark-ff = "0.4"
ark-ec = "0.4"
ark-bn254 = "0.4"

# Cryptography
sha3 = "0.10"
blake3 = "1.5"
hashing = "2.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Async
tokio = { version = "1.0", features = ["full"] }
rayon = "1.7"

# Testing
criterion = "0.5"

[dev-dependencies]
proptest = "1.0"

[[bench]]
name = "nova_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1