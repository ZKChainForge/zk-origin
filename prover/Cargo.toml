[package]
name = "zk-origin-prover"
version = "0.1.0"
edition = "2021"
authors = ["ZK-ORIGIN Team"]
description = "Zero-Knowledge State Lineage Verification using Nova IVC"
license = "MIT"
repository = "https://github.com/ZKChainForge/zk-origin"

[workspace]
members = [
    "src",
    "full_demo",
]

[lib]
name = "zk_origin"
path = "src/lib.rs"

[[bin]]
name = "zk-origin-cli"
path = "src/bin/cli.rs"

[[example]]
name = "simple_lineage"
path = "examples/simple_lineage.rs"

[[example]]
name = "multi_transition"
path = "examples/multi_transition.rs"

[[example]]
name = "verify_proof"
path = "examples/verify_proof.rs"

[[bench]]
name = "proving"
harness = false

[[bench]]
name = "verification"
harness = false

[[bench]]
name = "folding"
harness = false

[features]

default = []
benchmark = []
nova = []   


[dependencies]
# Nova proving system
nova-snark = "0.31"


# Curve implementations (Pasta curves for Nova)
pasta_curves = "0.5"

# Field arithmetic
ff = "0.13"

# Circuit building
bellpepper = "0.4"
bellpepper-core = "0.4"

# Poseidon hash
generic-array = "0.14"
typenum = "1.16"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Random number generation
rand = "0.8"
rand_core = "0.6"

# Utilities
hex = "0.4"
sha2 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
once_cell = "1.18"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.0"
tempfile = "3.0"



[profile.release]
opt-level = 3
lto = true

[profile.bench]
opt-level = 3
debug = false