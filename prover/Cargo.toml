[package]
name = "zk-origin-prover"
version = "1.0.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
hex = "0.4"
num-bigint = "0.4"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1.0", features = ["v4"] }
blake3 = "1.5"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1.0", features = ["full"] }

[[bench]]
name = "prover_bench"
harness = false

[[bench]]
name = "prover_benchmarks"
harness = false

[[bin]]
name = "witness_gen"
path = "src/bin/witness_gen.rs"