[package]
name = "zk-origin-prover"
version = "0.3.0"
edition = "2021"
authors = ["ZK-ORIGIN Contributors"]
description = "Zero-Knowledge State Lineage Verification using Nova IVC"
license = "MIT"

[lib]
name = "zk_origin"
path = "src/lib.rs"

[[bin]]
name = "zk-origin-cli"
path = "src/bin/cli.rs"

[dependencies]
# Nova proving system - use version with correct API
nova-snark = { version = "0.31", default-features = false }
pasta_curves = "0.5"

# Circuit building
bellpepper = "0.4"
bellpepper-core = "0.4"

# Field arithmetic
ff = "0.13"

# Poseidon hashing
neptune = "13.0"
generic-array = "0.14"
typenum = "1.17"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
hex = "0.4"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Hashing
sha2 = "0.10"

# Utilities
rand = "0.8"
rand_core = "0.6"
rand_xorshift = "0.3"  
lazy_static = "1.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
tempfile = "3.10"

[features]
default = ["commitment-mode"]
commitment-mode = []
real-nova = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1