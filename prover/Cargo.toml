# prover/Cargo.toml

[package]
name = "zk-origin-prover"
version = "0.2.0"
edition = "2021"
authors = ["ZK-ORIGIN Contributors"]
description = "Zero-Knowledge State Lineage Verification using Nova IVC"
license = "MIT"
repository = "https://github.com/ZKChainForge/zk-origin"
keywords = ["zero-knowledge", "nova", "lineage", "blockchain", "cryptography"]
categories = ["cryptography", "blockchain"]

[lib]
name = "zk_origin"
path = "src/lib.rs"

[[bin]]
name = "zk-origin-cli"
path = "src/bin/cli.rs"

[dependencies]
# Nova proving system
nova-snark = "0.31"
pasta_curves = "0.5"

# Circuit building
bellpepper = "0.4"
bellpepper-core = "0.4"

# Field arithmetic
ff = "0.13"

# Poseidon hashing
neptune = "13.0"
generic-array = "0.14"
typenum = "1.17"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
hex = "0.4"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Hashing (for non-circuit operations)
sha2 = "0.10"

# Utilities
rand = "0.8"
rand_core = "0.6"
lazy_static = "1.4"

# Async (for API)
tokio = { version = "1.0", features = ["full"], optional = true }

# Metrics (optional)
prometheus = { version = "0.13", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
tempfile = "3.10"

[features]
default = []
nova = []  # Enable full Nova integration
api = ["tokio"]
metrics = ["prometheus"]

[[bench]]
name = "proving"
harness = false

[[bench]]
name = "verification"
harness = false

[[bench]]
name = "folding"
harness = false

[[example]]
name = "simple_lineage"

[[example]]
name = "multi_transition"

[[example]]
name = "verify_proof"

[[example]]
name = "full_demo"

[profile.release]
opt-level = 3
lto = "thin"

[profile.bench]
opt-level = 3
debug = false